name: iO Workspace Keys VSIX
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx --no-install vsce package --out workspace-keys-io.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-keys-io-vsix
          path: workspace-keys-io.vsix
          if-no-files-found: error
